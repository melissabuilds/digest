name: Competitor digest

on:
  schedule:
    # Mondays at 13:37 UTC (8:37am ET in winter, 9:37am ET in summer).
    # GitHub runs cron in UTC only and does not follow daylight saving.
    - cron: "37 13 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run digest
        env:
          # Supplied by Actions. Scoped to this repo, expires with the run.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Leave unset and you get the plain diff.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 digest.py

      - name: Save what we saw this week
        run: |
          if [[ -n "$(git status --porcelain state.json digest.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json digest.json
            git commit -m "Digest for $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Nothing changed"
          fi
